# this is a YAML-formatted file
# declare variables to be passed into your templates

deploymentName: cards-deployment
serviceName: cards
appLabel: cards
appName: cards

replicaCount: 1

image:
  repository: pushnofear/cards
  tag: s17

containerPort: 9000

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

app_name_enabled: true
profile_enabled: true
config_enabled: true
discovery_enabled: true
resource_server_enabled: false
otel_enabled: true
kafka_enabled: false
